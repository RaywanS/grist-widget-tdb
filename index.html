<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord DNUM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
<style>
body { margin: 0; padding: 16px; background: var(--background-alt-grey, #f6f6f6); }
h1 { font-size: 1.5rem; margin: 0 0 .25rem 0; color: var(--text-title-blue-france, #000091); }
#err { display: none; background: #ffe9e9; border-left: 4px solid #ce0500; color: #ce0500; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #ddd; margin: 12px 0; }
.tb { border: 1px solid #ddd; border-bottom: 0; background: #eee; padding: 8px 14px; cursor: pointer; font: inherit; color: #3a3a3a; }
.tb.on { background: #fff; color: #000091; font-weight: 700; border-top: 2px solid #000091; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff; padding: 10px; margin-bottom: 12px; }
.filters input, .filters select { width: auto; min-width: 150px; }
.count { margin-left: auto; font-weight: 700; color: #000091; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi { background: #fff; padding: 10px 12px; border-left: 4px solid #000091; }
.kpi.w { border-left-color: #b34000; }
.kpi .v { font-size: 1.8rem; font-weight: 700; color: #000091; line-height: 1.2; }
.kpi .l { font-size: .8rem; color: #666; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
.box { background: #fff; padding: 10px 12px; min-width: 0; margin-bottom: 12px; }
.cols .box { margin-bottom: 0; }
.box h2 { font-size: 1rem; margin: 0 0 8px 0; }
.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: .85rem; }
.bar .n { width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .t { flex: 1; background: #e5e5e5; height: 12px; }
.bar .f { background: #000091; height: 12px; }
.bar .c { width: 34px; text-align: right; font-weight: 700; }
.tw { max-height: 360px; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
th { position: sticky; top: 0; background: #f0f0f0; }
.empty { color: #777; font-style: italic; }
.note { font-size: .75rem; color: #666; margin-top: 4px; }
.kpi[data-d], .bar[data-d] { cursor: pointer; }
.kpi.act { outline: 2px solid #000091; background: #e3e3fd; }
.bar.act .n { font-weight: 700; color: #000091; }
.bar.act .f { background: #6a6af4; }
tr.rd td { background: #ffe9e9; color: #ce0500; font-weight: 600; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; cursor: pointer; }
.pt { display: none; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; padding: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tabs, .filters input, .filters select, .filters button, .chk { display: none !important; }
  .pt { display: block; color: #666; margin-bottom: 6px; }
  .tw { max-height: none; overflow: visible; }
  .box, .kpi, tr { break-inside: avoid; }
}
.rt { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tools { display: flex; gap: 12px; align-items: center; }
.lk { background: none; border: 0; padding: 0; font: inherit; font-size: .75rem; color: #666; text-decoration: underline; cursor: pointer; }
.lk:hover { color: #000091; }
.chk { font-size: .75rem; color: #666; gap: 4px; }
.chk input { margin: 0; }
.th { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.tbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-align: left; color: #161616; }
.chev::before { content: "\25BE"; color: #000091; }
.tb.closed .chev::before { content: "\25B8"; }
.tb.closed .th { margin-bottom: 0; }
.tq { width: 180px; padding: 4px 8px; font-size: .8rem; }
.sh { cursor: pointer; user-select: none; }
.sh:hover { color: #000091; }
@media print { .tq, .note, .tools { display: none !important; } }
</style>
</head>
<body>
<h1>Tableau de bord DNUM</h1>
<div id="ptitle" class="pt"></div>
<div id="err"></div>
<div class="tabs" id="tabs"></div>
<div class="filters">
  <input type="text" class="fr-input" id="f-q" placeholder="Rechercher un produit">
  <select class="fr-select" id="f-statut"></select>
  <select class="fr-select" id="f-dept"></select>
  <select class="fr-select" id="f-crit"></select>
  <select class="fr-select" id="f-strat"></select>
  <button type="button" class="fr-btn fr-btn--secondary fr-btn--sm" id="f-reset">Réinitialiser</button>
  <span id="drill" title="Cliquer pour retirer ce filtre"></span>
  <div class="rt">
    <span class="count" id="count">Chargement...</span>
    <div class="tools">
      <label class="chk"><input type="checkbox" id="f-red"> Complétion &lt; 80 % en rouge</label>
      <button type="button" class="lk" id="f-csv">Export CSV</button>
      <button type="button" class="lk" id="f-pdf">Export PDF</button>
    </div>
  </div>
</div>
<div id="main"></div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>
var COL = {
  produit: "Produit", statut: "Statut_actuel", dept: "Departement_SDPC", crit: "Criticite",
  strat: "Produit_strategique", compl: "Taux_de_completion", maj: "Date_de_derniere_mise_a_jour",
  majAlt: "Date_de_mise_a_jour", vides: "Nombre_de_champs_critiques_vides",
  homol: "Statut_d_homologation_de_securite", homolFin: "Fin_de_validite_d_homologation",
  rgaa: "RGAA_Taux_de_conformite", pca: "Inscription_au_PCA", obso: "Obsolescence",
  c26: "Cible_RenovSI_2026", c27: "Cible_RenovSI_2027", e26: "RenovSI_2026_Etat",
  pic: "tech_PIC_etat_de_la_migration",
  vis: "Vision_strategie", usr: "Connaissance_utilisateurs_design",
  imp: "Mesure_d_impact", del: "Delivery_iteration"
};
// Seuils modifiables
var CFG = { complRouge: 80, complFaible: 50, rgaaSeuil: 75, joursMaj: 180, moisHomol: 6 };

var TABS = [["overview", "Vue d'ensemble"], ["portfolio", "Portefeuille"], ["risks", "Risques & conformité"], ["modern", "Modernisation"], ["maturity", "Maturité & qualité"]];
var ALL = [], F = { q: "", statut: "", dept: "", crit: "", strat: "" }, TAB = "overview", SC = 1, SR = 1, DR = [], DRILL = null, REDON = false;

function showError(m) { var e = document.getElementById("err"); e.style.display = "block"; e.textContent = "Erreur : " + m; }
window.onerror = function (m, s, l) { showError(m + " (ligne " + l + ")"); };

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function toList(v) {
  var o = [], i;
  if (v === null || v === undefined || v === "") { return o; }
  if (Array.isArray(v)) {
    for (i = 0; i < v.length; i++) { if (i === 0 && v[i] === "L") { continue; } if (v[i] !== null && v[i] !== undefined && v[i] !== "") { o.push(String(v[i])); } }
    return o;
  }
  if (typeof v === "string" && v.charAt(0) === "[") { try { return toList(JSON.parse(v)); } catch (e) { return [v]; } }
  return [String(v)];
}
function T(r, c) { var l = toList(r[c]); return l.length ? l[0] : ""; }
function norm(s) {
  s = String(s).toLowerCase();
  try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch (e) {}
  return s;
}
function has(r, c, word) { return norm(toList(r[c]).join(" ")).indexOf(word) !== -1; }
function filled(r, c) { return toList(r[c]).length > 0; }
function isNo(s) { s = norm(s); return s === "non" || s === "aucun" || s === "false" || s === "n/a"; }
function yesList(r, c) { var l = toList(r[c]), i; for (i = 0; i < l.length; i++) { if (!isNo(l[i])) { return true; } } return false; }

function toDate(v) {
  var d, m;
  if (v === null || v === undefined || v === "") { return null; }
  if (v instanceof Date) { return isNaN(v.getTime()) ? null : v; }
  if (typeof v === "number") { d = new Date(v < 100000000000 ? v * 1000 : v); return isNaN(d.getTime()) ? null : d; }
  v = String(v).replace(/^\s+|\s+$/g, "");
  m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) { return new Date(+m[3], +m[2] - 1, +m[1]); }
  d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(d) { return d ? ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear() : ""; }
function majDate(r) { return toDate(r[COL.maj]) || toDate(r[COL.majAlt]); }
function pct(r, c, sc) { return typeof r[c] === "number" ? Math.round(r[c] * sc) : null; }
function scaleOf(c) { var i, mx = 0; for (i = 0; i < ALL.length; i++) { if (typeof ALL[i][c] === "number" && ALL[i][c] > mx) { mx = ALL[i][c]; } } return (mx > 0 && mx <= 1) ? 100 : 1; }

// Règles métier (à ajuster selon vos valeurs)
function isActive(r) { var s = norm(T(r, COL.statut)); return s !== "" && s.indexOf("decommission") === -1; }
function isStrat(r) { return yesList(r, COL.strat); }
function isCrit(r) { var s = norm(T(r, COL.crit)); if (s.indexOf("non") === 0) { return false; } return s.indexOf("critique") !== -1 || s.indexOf("essentiel") !== -1; }
function isObso(r) { return yesList(r, COL.obso) || norm(T(r, COL.statut)).indexOf("decommission") !== -1; }
function homolOk(r) { var s = norm(T(r, COL.homol)); return s.indexOf("homolog") !== -1 && s.indexOf("en cours") === -1 && s.indexOf("non") !== 0; }
function homolEnCours(r) { return norm(T(r, COL.homol)).indexOf("en cours") !== -1; }
function homolBientot(r) {
  var d = toDate(r[COL.homolFin]), now = new Date(), lim = new Date();
  lim.setMonth(lim.getMonth() + CFG.moisHomol);
  return d !== null && d <= lim;
}
function noPca(r) { return isCrit(r) && norm(T(r, COL.pca)).indexOf("oui") === -1; }
function rgaaBas(r) { var p = pct(r, COL.rgaa, SR); return p !== null && p < CFG.rgaaSeuil; }
function complBas(r) { var p = pct(r, COL.compl, SC); return p !== null && p < CFG.complFaible; }
function vieux(r) { var d = majDate(r); return d === null || ((new Date()) - d) / 86400000 > CFG.joursMaj; }
function videsCrit(r) { return typeof r[COL.vides] === "number" && r[COL.vides] > 0; }
function statutIs(r, w) {
  var s = norm(T(r, COL.statut));
  if (w === "adecom") { return s.indexOf("decommissionner") !== -1; }
  if (w === "decom") { return s.indexOf("decommission") !== -1 && s.indexOf("decommissionner") === -1; }
  return s.indexOf(w) !== -1;
}
function cible26(r) { return yesList(r, COL.c26); }
function cible27(r) { return yesList(r, COL.c27); }
function sansTraj(r) { return !cible26(r) && !cible27(r); }
function migFaite(r) { var s = norm(T(r, COL.e26)); return s.indexOf("effectu") !== -1 || s.indexOf("termin") !== -1 || s.indexOf("realis") !== -1; }
function migEnCours(r) { return norm(T(r, COL.e26)).indexOf("en cours") !== -1; }
var DIMS = [["Vision & stratégie", "vis"], ["Connaissance utilisateurs & design", "usr"], ["Mesure d'impact", "imp"], ["Delivery & itération", "del"]];
function matInc(r) { var i; for (i = 0; i < DIMS.length; i++) { if (!filled(r, COL[DIMS[i][1]])) { return true; } } return false; }

function passF(r) {
  if (F.q !== "" && norm(T(r, COL.produit)).indexOf(norm(F.q)) === -1) { return false; }
  if (F.statut !== "" && T(r, COL.statut) !== F.statut) { return false; }
  if (F.dept !== "" && T(r, COL.dept) !== F.dept) { return false; }
  if (F.crit !== "" && T(r, COL.crit) !== F.crit) { return false; }
  if (F.strat === "oui" && !isStrat(r)) { return false; }
  if (F.strat === "non" && isStrat(r)) { return false; }
  if (DRILL !== null && !DRILL.fn(r)) { return false; }
  return true;
}

// Briques d'affichage
function cnt(rows, fn) { var n = 0, i; for (i = 0; i < rows.length; i++) { if (fn(rows[i])) { n++; } } return n; }
function reg(label, fn) { DR.push({ label: label, fn: fn }); return DR.length - 1; }
function isAct(label) { return DRILL !== null && DRILL.label === label; }
function kpis(rows, items) {
  var h = '<div class="kpis">', i, it, v, a, lab;
  for (i = 0; i < items.length; i++) {
    it = items[i]; a = ""; lab = "KPI : " + it[0];
    if (typeof it[1] === "function") { v = cnt(rows, it[1]); a = ' data-d="' + reg(lab, it[1]) + '" title="Cliquer pour filtrer"'; } else { v = it[1]; }
    h += '<div class="kpi' + (it[2] ? " w" : "") + (isAct(lab) ? " act" : "") + '"' + a + '><div class="v">' + v + '</div><div class="l">' + esc(it[0]) + "</div></div>";
  }
  return h + "</div>";
}
function countBy(rows, fn) { var o = {}, i, k; for (i = 0; i < rows.length; i++) { k = fn(rows[i]) || "(non renseigné)"; o[k] = (o[k] || 0) + 1; } return o; }
function mk(fn, k) { return function (r) { return (fn(r) || "(non renseigné)") === k; }; }
function bars(title, rows, fn) {
  var counts = countBy(rows, fn), keys = [], k, i, mx = 0, lab, h = '<div class="box"><h2>' + esc(title) + "</h2>";
  for (k in counts) { if (counts.hasOwnProperty(k)) { keys.push(k); if (counts[k] > mx) { mx = counts[k]; } } }
  keys.sort(function (a, b) { return counts[b] - counts[a]; });
  if (!keys.length) { return h + '<div class="empty">Aucune donnée</div></div>'; }
  for (i = 0; i < keys.length; i++) {
    lab = title + " : " + keys[i];
    h += '<div class="bar' + (isAct(lab) ? " act" : "") + '" data-d="' + reg(lab, mk(fn, keys[i])) + '" title="Cliquer pour filtrer"><div class="n">' + esc(keys[i]) + '</div><div class="t"><div class="f" style="width:' + Math.round(counts[keys[i]] * 100 / mx) + '%"></div></div><div class="c">' + counts[keys[i]] + "</div></div>";
  }
  return h + "</div>";
}
var TB = {}, TS = {}, TBN = 0;
function tstate(k) { if (!TS[k]) { TS[k] = { open: true, all: false, q: "", col: -1, dir: 1 }; } return TS[k]; }
function tbl(title, rows, cols, limit) {
  var id = "t" + (TBN++), st = tstate(TAB + "|" + title);
  TB[id] = { title: title, rows: rows, cols: cols, limit: limit, st: st };
  return '<div class="box tb" id="' + id + '"><div class="th"><button type="button" class="tbtn" aria-expanded="true" data-a="open" data-t="' + id + '"><span class="chev"></span>' + esc(title) +
    ' <span class="fr-badge fr-badge--sm fr-badge--info" id="' + id + 'n"></span></button><input type="text" class="tq fr-input" data-t="' + id + '" placeholder="Filtrer cette liste" value="' + esc(st.q) + '"></div><div id="' + id + 'b"></div></div>';
}
function sortKey(s) {
  var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (m) { return +(m[3] + m[2] + m[1]); }
  if (/^-?\d+([.,]\d+)?\s*%?$/.test(s)) { return parseFloat(s.replace(",", ".")); }
  return null;
}
function drawTable(id) {
  var t = TB[id], st = t.st, items = [], i, j, c, q = norm(st.q), h, n, box = document.getElementById(id);
  box.className = "box tb" + (st.open ? "" : " closed");
  box.getElementsByTagName("button")[0].setAttribute("aria-expanded", st.open ? "true" : "false");
  for (i = 0; i < t.rows.length; i++) {
    c = [];
    for (j = 0; j < t.cols.length; j++) { c.push(String(t.cols[j][1](t.rows[i]))); }
    if (q === "" || norm(c.join(" ")).indexOf(q) !== -1) { items.push({ r: t.rows[i], c: c }); }
  }
  document.getElementById(id + "n").textContent = items.length === t.rows.length ? t.rows.length : items.length + " / " + t.rows.length;
  if (st.col >= 0) {
    items.sort(function (a, b) {
      var x = a.c[st.col], y = b.c[st.col], kx, ky, r;
      if (x === y) { return 0; }
      if (x === "") { return 1; }
      if (y === "") { return -1; }
      kx = sortKey(x); ky = sortKey(y);
      r = (kx !== null && ky !== null) ? kx - ky : x.localeCompare(y, "fr");
      return r * st.dir;
    });
  }
  if (!st.open) { document.getElementById(id + "b").innerHTML = ""; return; }
  n = (st.all || !t.limit) ? items.length : Math.min(t.limit, items.length);
  h = '<div class="tw"><table><tr>';
  for (j = 0; j < t.cols.length; j++) {
    h += '<th class="sh" data-a="sort" data-t="' + id + '" data-c="' + j + '">' + esc(t.cols[j][0]) + (st.col === j ? (st.dir === 1 ? " \u25B2" : " \u25BC") : "") + "</th>";
  }
  h += "</tr>";
  for (i = 0; i < n; i++) {
    h += (REDON && lowC(items[i].r)) ? '<tr class="rd">' : "<tr>";
    for (j = 0; j < t.cols.length; j++) { h += "<td>" + esc(items[i].c[j]) + "</td>"; }
    h += "</tr>";
  }
  if (!items.length) { h += '<tr><td colspan="' + t.cols.length + '" class="empty">Aucun produit.</td></tr>'; }
  h += "</table></div>";
  if (t.limit && items.length > t.limit) {
    h += '<div class="note"><button type="button" class="lk" data-a="all" data-t="' + id + '">' + (st.all ? "Réduire la liste" : "Afficher les " + items.length + " produits (" + t.limit + " affichés)") + "</button></div>";
  }
  document.getElementById(id + "b").innerHTML = h;
}
function tableAction(n) {
  var a = n.getAttribute("data-a"), id = n.getAttribute("data-t"), st = TB[id].st, j;
  if (a === "open") { st.open = !st.open; }
  if (a === "all") { st.all = !st.all; }
  if (a === "sort") { j = +n.getAttribute("data-c"); if (st.col === j) { st.dir = -st.dir; } else { st.col = j; st.dir = 1; } }
  drawTable(id);
}
function sel(fn, rows) { var o = [], i; for (i = 0; i < rows.length; i++) { if (fn(rows[i])) { o.push(rows[i]); } } return o; }
function P(r) { return T(r, COL.produit); }
function pc(c, sc) { return function (r) { var p = pct(r, c, sc); return p === null ? "" : p + " %"; }; }
function tx(c) { return function (r) { return T(r, c); }; }
function lst(c) { return function (r) { return toList(r[c]).join(", "); }; }
var C_BASE = [["Produit", P], ["Statut", tx("Statut_actuel")], ["Département", tx("Departement_SDPC")], ["Criticité", tx("Criticite")]];

// Onglets
function avgC(rows) {
  var s = 0, n = 0, i, p;
  for (i = 0; i < rows.length; i++) { p = pct(rows[i], COL.compl, SC); if (p !== null) { s += p; n++; } }
  return n ? Math.round(s / n) + " %" : "-";
}
function dFin(r) { return fmtDate(toDate(r[COL.homolFin])); }
function homol3(r) { var d = toDate(r[COL.homolFin]), l = new Date(); l.setMonth(l.getMonth() + 3); return d !== null && d <= l; }
function mkS(w) { return function (r) { return statutIs(r, w); }; }
function mkF(c) { return function (r) { return !filled(r, c); }; }
function vOverview(rows) {
  var al = [["Homologation à échéance (" + CFG.moisHomol + " mois)", homolBientot, [["Fin de validité", dFin]]],
    ["Complétion faible (< " + CFG.complFaible + " %)", complBas, [["Complétion", pc(COL.compl, SC)]]],
    ["Obsolètes ou en décommissionnement", isObso, [["Obsolescence", tx(COL.obso)]]],
    ["Non mis à jour depuis " + CFG.joursMaj + " jours", vieux, [["Dernière MAJ", function (r) { return fmtDate(majDate(r)); }]]],
    ["Critiques non inscrits au PCA", noPca, [["PCA", tx(COL.pca)]]]], h, i;
  h = kpis(rows, [["Produits dans la sélection", rows.length], ["Produits actifs", isActive], ["Produits stratégiques", isStrat], ["Critiques ou essentiels", isCrit],
    ["Complétion moyenne", avgC(rows)], ["Produits à compléter", function (r) { return complBas(r) || videsCrit(r); }, 1]]);
  h += '<div class="cols">' + bars("Produits par statut actuel", rows, tx(COL.statut)) + bars("Produits par département", rows, tx(COL.dept)) + "</div>";
  for (i = 0; i < al.length; i++) { h += tbl("Alerte : " + al[i][0], sel(al[i][1], rows), [["Produit", P], ["Département", tx(COL.dept)]].concat(al[i][2]), 8); }
  return h;
}
function vPortfolio(rows) {
  var K = [["En cadrage", "cadrage"], ["En build", "build"], ["En amélioration continue", "amelioration"], ["En MCO", "mco"], ["En transfert", "transfert"], ["À décommissionner", "adecom"], ["Décommissionnés", "decom"]], it = [["Produits", rows.length]], i;
  for (i = 0; i < K.length; i++) { it.push([K[i][0], mkS(K[i][1])]); }
  return kpis(rows, it) + '<div class="cols">' + bars("Cycle de vie", rows, tx(COL.statut)) + bars("Département", rows, tx(COL.dept)) + "</div>" +
    tbl("Produits", rows, C_BASE.concat([["Stratégique", function (r) { return isStrat(r) ? "Oui" : "Non"; }], ["Complétion", pc(COL.compl, SC)], ["Dernière MAJ", function (r) { return fmtDate(majDate(r)); }]]), 150);
}
function vRisks(rows) {
  return kpis(rows, [["Produits homologués", homolOk], ["Homologations en cours", homolEnCours], ["Échéance < 3 mois", homol3, 1], ["Échéance < " + CFG.moisHomol + " mois", homolBientot, 1],
    ["RGAA < " + CFG.rgaaSeuil + " %", rgaaBas, 1], ["Critiques sans PCA", noPca, 1], ["Produits obsolètes", isObso, 1], ["Champs critiques manquants", videsCrit, 1]]) +
    tbl("Homologation bientôt échue", sel(homolBientot, rows), C_BASE.concat([["Homologation", tx(COL.homol)], ["Fin de validité", dFin]]), 50) +
    tbl("Produits critiques sans PCA", sel(noPca, rows), C_BASE.concat([["PCA", tx(COL.pca)]]), 50) +
    tbl("Conformité RGAA insuffisante", sel(rgaaBas, rows), C_BASE.concat([["RGAA", pc(COL.rgaa, SR)]]), 50) +
    tbl("Obsolètes ou à décommissionner", sel(isObso, rows), C_BASE.concat([["Obsolescence", tx(COL.obso)]]), 50);
}
function splitC(c) { return function (r) { var l = toList(r[c]), o = [], i; for (i = 0; i < l.length; i++) { if (!isNo(l[i])) { o.push(l[i]); } } return o.join(", "); }; }
function vModern(rows) {
  return kpis(rows, [["Ciblés RenovSI 2026", cible26], ["Ciblés RenovSI 2027", cible27], ["Migrations effectuées", migFaite], ["Migrations en cours", migEnCours], ["Sans trajectoire définie", sansTraj, 1]]) +
    '<div class="cols">' + bars("État RenovSI 2026", rows, tx(COL.e26)) + bars("État migration PIC", rows, tx(COL.pic)) +
    bars("Cible RenovSI 2026", rows, splitC(COL.c26)) + bars("Cible RenovSI 2027", rows, splitC(COL.c27)) + "</div>" +
    tbl("Produits", rows, [["Produit", P], ["Cible 2026", lst(COL.c26)], ["Cible 2027", lst(COL.c27)], ["État RenovSI", tx(COL.e26)], ["État PIC", tx(COL.pic)], ["Criticité", tx(COL.crit)], ["Département", tx(COL.dept)]], 150);
}
function vMaturity(rows) {
  var it = [], g = "", i;
  for (i = 0; i < DIMS.length; i++) { it.push(["Sans " + DIMS[i][0], mkF(COL[DIMS[i][1]]), 1]); }
  it.push(["Maturité incomplète", matInc, 1]); it.push(["Complétion moyenne", avgC(rows)]);
  for (i = 0; i < DIMS.length; i++) { g += bars(DIMS[i][0], rows, tx(COL[DIMS[i][1]])); }
  return kpis(rows, it) + '<div class="cols">' + g + "</div>" + tbl("Produits à données de maturité incomplètes", sel(matInc, rows), C_BASE.concat([["Complétion", pc(COL.compl, SC)]]), 100);
}
var VIEWS = { overview: vOverview, portfolio: vPortfolio, risks: vRisks, modern: vModern, maturity: vMaturity };

function render() {
  try {
    DR = []; TB = {}; TBN = 0;
    var rows = sel(passF, ALL), i, h = "";
    for (i = 0; i < TABS.length; i++) { h += '<button type="button" class="tb' + (TABS[i][0] === TAB ? " on" : "") + '" data-t="' + TABS[i][0] + '">' + esc(TABS[i][1]) + "</button>"; }
    document.getElementById("tabs").innerHTML = h;
    document.getElementById("count").textContent = rows.length + " produit(s) sur " + ALL.length;
    document.getElementById("drill").innerHTML = DRILL ? '<span class="fr-badge fr-badge--sm fr-badge--blue-ecume">' + esc(DRILL.label) + " \u2715</span>" : "";
    document.getElementById("ptitle").textContent = "Onglet : " + (TABS[0][0] === TAB ? TABS[0][1] : TABS[[0, 1, 2, 3, 4].filter(function (k) { return TABS[k][0] === TAB; })[0]][1]) + " - " + fmtDate(new Date());
    document.getElementById("main").innerHTML = VIEWS[TAB](rows);
    for (i in TB) { if (TB.hasOwnProperty(i)) { drawTable(i); } }
  } catch (e) { showError(e.message); }
}

function lowC(r) { var p = pct(r, COL.compl, SC); return p !== null && p < CFG.complRouge; }
function csvCell(v) { v = String(v === null || v === undefined ? "" : v); return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  var rows = sel(passF, ALL), i, j, l = [], line,
    cols = [["Produit", P], ["Statut actuel", tx(COL.statut)], ["Département", tx(COL.dept)], ["Criticité", tx(COL.crit)],
      ["Stratégique", function (r) { return isStrat(r) ? "Oui" : "Non"; }], ["Complétion (%)", function (r) { var p = pct(r, COL.compl, SC); return p === null ? "" : p; }],
      ["Dernière mise à jour", function (r) { return fmtDate(majDate(r)); }], ["Homologation", tx(COL.homol)], ["Fin d'homologation", dFin],
      ["RGAA (%)", function (r) { var p = pct(r, COL.rgaa, SR); return p === null ? "" : p; }], ["PCA", tx(COL.pca)], ["Obsolescence", tx(COL.obso)],
      ["Cible RenovSI 2026", lst(COL.c26)], ["Cible RenovSI 2027", lst(COL.c27)], ["État RenovSI 2026", tx(COL.e26)], ["État PIC", tx(COL.pic)],
      ["Vision & stratégie", tx(COL.vis)], ["Connaissance utilisateurs & design", tx(COL.usr)], ["Mesure d'impact", tx(COL.imp)], ["Delivery & itération", tx(COL.del)]];
  line = []; for (j = 0; j < cols.length; j++) { line.push(csvCell(cols[j][0])); } l.push(line.join(";"));
  for (i = 0; i < rows.length; i++) { line = []; for (j = 0; j < cols.length; j++) { line.push(csvCell(cols[j][1](rows[i]))); } l.push(line.join(";")); }
  var blob = new Blob(["\ufeff" + l.join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "produits_sdpc.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function uniq(c) {
  var s = {}, o = [], i, t;
  for (i = 0; i < ALL.length; i++) { t = T(ALL[i], c); if (t !== "" && !s[t]) { s[t] = true; o.push(t); } }
  return o.sort();
}
function fill(id, label, vals, cur) {
  var h = '<option value="">' + esc(label) + "</option>", i;
  for (i = 0; i < vals.length; i++) { h += '<option value="' + esc(vals[i]) + '"' + (vals[i] === cur ? " selected" : "") + ">" + esc(vals[i]) + "</option>"; }
  document.getElementById(id).innerHTML = h;
}
function buildSelects() {
  fill("f-statut", "Tous les statuts", uniq(COL.statut), F.statut);
  fill("f-dept", "Tous les départements", uniq(COL.dept), F.dept);
  fill("f-crit", "Toutes les criticités", uniq(COL.crit), F.crit);
  document.getElementById("f-strat").innerHTML = '<option value="">Stratégique : tous</option><option value="oui"' + (F.strat === "oui" ? " selected" : "") + '>Stratégiques</option><option value="non"' + (F.strat === "non" ? " selected" : "") + ">Non stratégiques</option>";
}
function bind() {
  var map = { "f-statut": "statut", "f-dept": "dept", "f-crit": "crit", "f-strat": "strat" }, id;
  document.getElementById("f-q").oninput = function () { F.q = this.value; render(); };
  for (id in map) { if (map.hasOwnProperty(id)) { document.getElementById(id).onchange = (function (k) { return function () { F[k] = this.value; render(); }; })(map[id]); } }
  document.getElementById("f-reset").onclick = function () { DRILL = null; F = { q: "", statut: "", dept: "", crit: "", strat: "" }; document.getElementById("f-q").value = ""; buildSelects(); render(); };
  document.getElementById("main").onclick = function (e) {
    var n = e.target, d;
    while (n && n !== this) {
      if (n.getAttribute && n.getAttribute("data-a")) { tableAction(n); return; }
      if (n.getAttribute && n.getAttribute("data-d") !== null) {
        d = DR[+n.getAttribute("data-d")];
        if (d) { DRILL = (DRILL !== null && DRILL.label === d.label) ? null : d; render(); }
        return;
      }
      n = n.parentNode;
    }
  };
  document.getElementById("main").oninput = function (e) {
    var n = e.target, id = n.getAttribute("data-t");
    if (id && TB[id] && String(n.className).indexOf("tq") !== -1) { TB[id].st.q = n.value; drawTable(id); }
  };
  document.getElementById("drill").onclick = function () { DRILL = null; render(); };
  document.getElementById("f-red").onchange = function () { REDON = this.checked; render(); };
  document.getElementById("f-csv").onclick = function () { try { exportCsv(); } catch (e) { showError("Export CSV : " + e.message); } };
  document.getElementById("f-pdf").onclick = function () { try { window.print(); } catch (e) { showError("Export PDF : " + e.message); } };
  document.getElementById("tabs").onclick = function (e) { var t = e.target.getAttribute("data-t"); if (t) { TAB = t; render(); } };
}

try {
  bind();
  grist.ready();
  grist.onRecords(function (records) {
    try { ALL = records || []; SC = scaleOf(COL.compl); SR = scaleOf(COL.rgaa); buildSelects(); render(); } catch (e) { showError(e.message); }
  });
} catch (e) { showError("Connexion Grist impossible : " + e.message); }
</script>
</body>
</html>
